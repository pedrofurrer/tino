name: Script bug
description: One of the four scripts gave a wrong result or failed.
labels: ["bug"]
body:
  - type: dropdown
    id: script
    attributes:
      label: Script
      options: [lint_continuity.py, rotate_logbook.py, lint_lessons.py, lint_index.py, a Spanish-set name of one of them]
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and operating system
      description: "For example: Python 3.12, macOS 15."
    validations:
      required: true
